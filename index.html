<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>배포 연습 페이지</title>
<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1f2937, #111827);
    color: #f3f4f6;
  }
  .card {
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 16px;
    padding: 2.5rem 2rem;
    max-width: 480px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
  }
  h1 {
    margin: 0 0 0.5rem;
    font-size: 1.6rem;
  }
  .badge {
    display: inline-block;
    margin-bottom: 1.25rem;
    padding: 0.25rem 0.75rem;
    border-radius: 999px;
    background: #2563eb;
    font-size: 0.8rem;
    font-weight: 600;
  }
  p.desc {
    color: #9ca3af;
    line-height: 1.5;
    margin-bottom: 1.5rem;
  }
  .clock {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 1.5rem;
  }
  .counter-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  button {
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0.6rem 1.2rem;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: #1d4ed8; }
  #count {
    font-size: 1.4rem;
    font-weight: 700;
    min-width: 2.5rem;
  }
  .footer {
    margin-top: 1.5rem;
    font-size: 0.8rem;
    color: #6b7280;
  }
  .status {
    margin-bottom: 1rem;
    font-size: 0.8rem;
    color: #9ca3af;
  }
  .status.ok { color: #34d399; }
  .status.error { color: #f87171; }
  #count.disabled { opacity: 0.4; }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">배포 테스트 v1</span>
    <h1>🚀 배포 연습 페이지</h1>
    <p class="desc">
      이 페이지는 GitHub Pages 또는 Firebase Hosting으로 배포하는 연습을 위한
      간단한 정적 웹페이지입니다. 배포가 끝나면 아래 시계와 버튼이
      정상적으로 동작하는지 확인해 보세요.
    </p>
    <div class="clock" id="clock">--:--:--</div>
    <div class="status" id="status">Firestore 연결 중...</div>
    <div class="counter-row">
      <button id="decrement">-</button>
      <span id="count">0</span>
      <button id="increment">+</button>
    </div>
    <div class="footer">
      이 카운터 값은 Firestore(<code>counter/main</code> 문서)에 저장됩니다.<br />
      새로고침하거나 다른 브라우저로 열어도 같은 값을 보게 되는지 확인해 보세요.
    </div>
  </div>

  <script>
    const clockEl = document.getElementById("clock");
    function updateClock() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      clockEl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
      getFirestore,
      doc,
      onSnapshot,
      setDoc,
      updateDoc,
      increment,
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    // TODO: Firebase 콘솔 > 프로젝트 설정 > 일반 > 내 앱(웹 앱)에서
    // 발급받은 설정값으로 아래를 채워주세요.
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID",
    };

    const statusEl = document.getElementById("status");
    const countEl = document.getElementById("count");
    const incrementBtn = document.getElementById("increment");
    const decrementBtn = document.getElementById("decrement");

    incrementBtn.disabled = true;
    decrementBtn.disabled = true;
    countEl.classList.add("disabled");

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const counterRef = doc(db, "counter", "main");

    onSnapshot(
      counterRef,
      (snap) => {
        if (snap.exists()) {
          countEl.textContent = snap.data().value ?? 0;
        } else {
          // 문서가 아직 없으면 0으로 생성
          setDoc(counterRef, { value: 0 });
          countEl.textContent = 0;
        }
        statusEl.textContent = "Firestore 연결됨 ✅";
        statusEl.className = "status ok";
        incrementBtn.disabled = false;
        decrementBtn.disabled = false;
        countEl.classList.remove("disabled");
      },
      (error) => {
        console.error(error);
        statusEl.textContent = "Firestore 연결 실패 - firebaseConfig 또는 보안 규칙을 확인하세요.";
        statusEl.className = "status error";
      }
    );

    incrementBtn.addEventListener("click", () => {
      updateDoc(counterRef, { value: increment(1) }).catch((err) => console.error(err));
    });
    decrementBtn.addEventListener("click", () => {
      updateDoc(counterRef, { value: increment(-1) }).catch((err) => console.error(err));
    });
  </script>
</body>
</html>
